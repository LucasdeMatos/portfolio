<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Links para meus projetos." />
    <title>Meu portfólio</title>
    <style>
      :root {
        font-family: Arial, Helvetica, sans-serif;
        color: #1a1a1a;
        background: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(100% - 48px, 360px);
        display: grid;
        gap: 14px;
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 1.5rem;
        font-weight: 600;
      }

      a {
        display: block;
        padding: 16px 20px;
        border: 1px solid #1a1a1a;
        border-radius: 10px;
        color: inherit;
        background: #ffffff;
        font-size: 1rem;
        font-weight: 600;
        text-decoration: none;
        transition: background 160ms ease, color 160ms ease;
      }

      a:hover,
      a:focus-visible {
        color: #ffffff;
        background: #1a1a1a;
        outline: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Meus projetos</h1>
      <a href="https://dellamed-conceito-2026.dimatos.chatgpt.site/" target="_blank" rel="noreferrer">Dellamed 2026</a>
      <a href="https://www.dimatos07.com.br/" target="_blank" rel="noreferrer">DiMatOS 07</a>
      <a href="https://lucasdematos.github.io/SelfieSpace/" target="_blank" rel="noreferrer">SelfieSpace</a>
    </main>
  </body>
</html>
